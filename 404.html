<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>404 · 页面未找到</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Noto Sans', sans-serif;
            background: linear-gradient(145deg, #eef2f7 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* 装饰性动态微粒背景 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 20% 30%, rgba(100, 108, 130, 0.08) 1.5%, transparent 2%),
                              radial-gradient(circle at 80% 70%, rgba(70, 90, 120, 0.06) 1.2%, transparent 1.8%);
            background-size: 48px 48px, 64px 64px;
            pointer-events: none;
            z-index: 0;
        }

        /* 主卡片 */
        .error-container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(0px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.2), 0 2px 6px rgba(0,0,0,0.02);
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.3s;
            z-index: 10;
            border: 1px solid rgba(255,255,245,0.6);
        }

        .error-container:hover {
            transform: translateY(-4px);
            box-shadow: 0 32px 56px -16px rgba(0, 0, 0, 0.25);
        }

        /* 顶部装饰细条 */
        .accent-bar {
            height: 6px;
            background: linear-gradient(90deg, #6c8fb3, #9bb7d4, #c2d4e6);
        }

        /* 内容区 */
        .content {
            padding: 2.5rem 2rem 3rem;
            text-align: center;
        }

        @media (min-width: 560px) {
            .content {
                padding: 3rem 2.8rem 3.5rem;
            }
        }

        /* 404 超大艺术字 */
        .error-code {
            font-size: 7rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(125deg, #2c4c6e, #5680a7, #8aaec0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.05);
            letter-spacing: -2px;
            margin-bottom: 0.75rem;
        }

        @media (min-width: 500px) {
            .error-code {
                font-size: 9rem;
            }
        }

        /* 主要提示 */
        .message-title {
            font-size: 1.7rem;
            font-weight: 600;
            color: #1e3b4f;
            margin-bottom: 0.8rem;
            letter-spacing: -0.3px;
        }

        .description {
            color: #5c6f87;
            font-size: 1rem;
            max-width: 380px;
            margin: 0 auto 1.2rem;
            line-height: 1.5;
        }

        /* 服务器标识 (原nginx信息优雅呈现) */
        .server-tag {
            background: #eef2f9;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.4rem 1.2rem;
            margin: 0.5rem 0 1.2rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #446688;
            border: 1px solid #dce5ef;
        }

        .server-tag span {
            font-size: 1rem;
        }

        /* 搜索或者返回按钮组 */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0 0.8rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.7rem 1.6rem;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            background: white;
            border: 1px solid #cbdde9;
            color: #2c5a7a;
            cursor: pointer;
        }

        .btn-primary {
            background: #2c7da0;
            border-color: #2c7da0;
            color: white;
            box-shadow: 0 2px 8px rgba(44,125,160,0.15);
        }

        .btn-primary:hover {
            background: #1f6585;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.1);
        }

        .btn-outline:hover {
            background: #eef3fc;
            border-color: #8eb3cc;
            transform: translateY(-1px);
        }

        /* 趣味插图占位(简单矢量风格) */
        .illustration {
            margin: 0.5rem 0 1rem;
            font-size: 4.2rem;
            opacity: 0.7;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.05));
        }

        /* 底部微妙信息 */
        .footer-note {
            margin-top: 2.2rem;
            font-size: 0.7rem;
            color: #93a9c2;
            border-top: 1px solid #e2ebf3;
            padding-top: 1.5rem;
            text-align: center;
        }

        .footer-note a {
            color: #5a7d9e;
            text-decoration: none;
            border-bottom: 1px dotted #b9cee4;
        }
        .footer-note a:hover {
            color: #2c5a7a;
        }

        /* 辅助提示 */
        .hint-text {
            font-size: 0.75rem;
            color: #8aa1bc;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="accent-bar"></div>
    <div class="content">
        <!-- 小图标装饰 -->
        <div class="illustration">
            🔍 🌐
        </div>
        
        <!-- 主错误码 -->
        <div class="error-code">404</div>
        <div class="message-title">哎呀！页面走丢了</div>
        <div class="description">
            您访问的链接可能已失效，或者页面被移到了新的地址。
        </div>

        <!-- 优雅显示原服务器标识（nginx 信息保留但友好化） -->
        <div class="server-tag">
            <span>🖥️</span> 服务器 · nginx
        </div>

        <!-- 交互按钮区：返回首页/刷新/联系管理员可选 -->
        <div class="action-buttons">
            <a href="/" class="btn btn-primary" id="homeLink">
                🏠 返回首页
            </a>
            <button class="btn btn-outline" id="reloadBtn">
                🔄 刷新页面
            </button>
            <button class="btn btn-outline" id="backBtn">
                ⬅️ 返回上一页
            </button>
        </div>

        <!-- 提供轻微建议 -->
        <div class="hint-text">
            💡 您也可以检查网址是否输入正确，或通过导航菜单查找内容。
        </div>

        <div class="footer-note">
            ⚡ <a href="/">站点首页</a> · 如遇到持续问题，请联系网站管理员
        </div>
    </div>
</div>

<script>
    (function() {
        // 获取按钮元素
        const homeLink = document.getElementById('homeLink');
        const reloadBtn = document.getElementById('reloadBtn');
        const backBtn = document.getElementById('backBtn');
        
        // 确保首页链接默认行为正常（保留原有href="/"）
        if (homeLink) {
            homeLink.addEventListener('click', (e) => {
                // 保留原生跳转，无需额外处理，仅增加平滑可选项
            });
        }
        
        if (reloadBtn) {
            reloadBtn.addEventListener('click', (e) => {
                e.preventDefault();
                window.location.reload();
            });
        }
        
        if (backBtn) {
            backBtn.addEventListener('click', (e) => {
                e.preventDefault();
                window.history.back();
            });
        }

        // 添加一个简单的键盘监听：按 F5 或 Ctrl+R 自然支持，不用额外处理，但让用户更清楚
        // 同时增加控制台友好提醒（可选静默）
        console.log("404 美化了页面 — 优雅错误页 | nginx");
    })();
</script>
</body>
</html>
