<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>迷你世界物品ID查询器</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.05);
            --badge-bg: #eff6ff;
            --badge-border: #dbeafe;
            --badge-text: #2563eb;
            --switch-bg: #f1f5f9;
            --switch-border: #e2e8f0;
            --switch-text: #475569;
            --input-bg: #fcfcfd;
            --btn-sec-bg: #ffffff;
            --btn-sec-text: #1e293b;
            --table-th-bg: #f8fafc;
            --id-badge-bg: #f1f5f9;
            --modal-overlay: rgba(0, 0, 0, 0.45);
            --version-btn-bg: var(--switch-bg);
            --version-btn-border: var(--switch-border);
            --version-btn-text: var(--switch-text);
            --version-btn-active-bg: var(--primary-color);
            --version-btn-active-text: #ffffff;
            --recipe-tag-bg: #eef2ff;
            --recipe-tag-border: #c7d2fe;
            --recipe-tag-text: #4338ca;
            --select-item-hover: #f1f5f9;
            --btn-sm-bg: #e2e8f0;
            --btn-sm-text: #1e293b;
        }

        html[data-theme="dark"] {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
            --badge-bg: rgba(30, 58, 138, 0.4);
            --badge-border: rgba(59, 130, 246, 0.3);
            --badge-text: #93c5fd;
            --switch-bg: #334155;
            --switch-border: #475569;
            --switch-text: #cbd5e1;
            --input-bg: #0f172a;
            --btn-sec-bg: #1e293b;
            --btn-sec-text: #cbd5e1;
            --table-th-bg: #1e293b;
            --id-badge-bg: #334155;
            --modal-overlay: rgba(0, 0, 0, 0.7);
            --version-btn-bg: #334155;
            --version-btn-border: #475569;
            --version-btn-text: #cbd5e1;
            --version-btn-active-bg: #3b82f6;
            --version-btn-active-text: #ffffff;
            --recipe-tag-bg: #1e293b;
            --recipe-tag-border: #3b82f6;
            --recipe-tag-text: #93c5fd;
            --select-item-hover: #334155;
            --btn-sm-bg: #475569;
            --btn-sm-text: #e2e8f0;
        }

        body,
        .card,
        .winui-input,
        .btn,
        .item-table,
        .item-table th,
        .item-table td,
        .copy-btn,
        .id-badge,
        .pagination-modern,
        .pagination-modern button,
        .version-btn,
        .version-badge,
        .modal-box,
        .modal-box input,
        .modal-box button,
        .format-option {
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            padding: 12px;
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeInUp 0.4s ease-out forwards; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }

        .app-titlebar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .title-area h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
        }

        .version-badge {
            background: var(--badge-bg);
            padding: 4px 8px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--badge-text);
            border: 1px solid var(--badge-border);
            white-space: nowrap;
        }

        .version-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .version-btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--version-btn-border);
            background: var(--version-btn-bg);
            color: var(--version-btn-text);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .version-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .version-btn.active {
            background: var(--version-btn-active-bg);
            border-color: var(--version-btn-active-bg);
            color: var(--version-btn-active-text);
        }

        .search-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-box-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box-wrapper .icon-box {
            position: absolute;
            left: 12px;
            color: var(--text-sub);
            width: 16px;
            height: 16px;
            pointer-events: none;
        }

        .winui-input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--input-bg);
            color: var(--text-main);
            outline: none;
        }

        .winui-input:focus {
            border-color: var(--primary-color);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            height: 44px;
            padding: 0 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex-direction: row;
        }

        .btn-primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }
        .btn-secondary {
            background: var(--btn-sec-bg);
            color: var(--btn-sec-text);
        }
        .btn-secondary:hover {
            background: var(--border-color);
        }

        @media (max-width: 767px) {
            .btn { flex: 1; }
        }
        @media (min-width: 768px) {
            .search-wrapper { flex-direction: row; }
        }

        .datagrid-container {
            overflow-x: auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            margin-bottom: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .item-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            table-layout: auto;
        }

        .item-table th,
        .item-table td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            text-align: left;
        }

        .item-table th {
            background: var(--table-th-bg);
            font-weight: 600;
            color: var(--text-sub);
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .name-cell {
            font-weight: 600;
            color: var(--text-main);
            min-width: 100px;
        }

        .id-badge {
            background: var(--id-badge-bg);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--primary-color);
            border: 1px solid var(--border-color);
            display: inline-block;
        }

        .desc-cell {
            white-space: normal !important;
            min-width: 180px;
            max-width: 300px;
            font-size: 0.8rem;
            color: var(--text-sub);
            line-height: 1.4;
        }

        .recipe-tag {
            display: inline-block;
            background: var(--recipe-tag-bg);
            border: 1px solid var(--recipe-tag-border);
            border-radius: 4px;
            padding: 2px 8px;
            margin: 2px 4px 2px 0;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--recipe-tag-text);
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .recipe-tag:hover {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }
        .recipe-tag .qty {
            opacity: 0.6;
            margin-left: 2px;
            font-weight: 400;
        }

        @media (max-width: 640px) {
            .item-table th:nth-child(4),
            .item-table td:nth-child(4),
            .item-table th:nth-child(5),
            .item-table td:nth-child(5) {
                display: none;
            }
        }

        .copy-btn {
            background: var(--btn-sec-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0 10px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--btn-sec-text);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
            flex-direction: row;
            height: 32px;
            min-height: 32px;
            max-height: 32px;
            box-sizing: border-box;
            line-height: 1;
        }

        .copy-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .copy-btn.cmd-btn {
            margin-left: 4px;
        }

        .icon-container {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .item-icon {
            max-width: 32px;
            max-height: 32px;
            display: none;
        }
        .icon-placeholder {
            width: 28px;
            height: 28px;
            color: var(--text-sub);
        }

        .pagination-modern {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
        }

        .pagination-modern button {
            background: var(--btn-sec-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            color: var(--btn-sec-text);
        }

        .pagination-modern button:hover:not(:disabled) {
            background: var(--border-color);
        }

        .pagination-modern button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .footer-copyright {
            text-align: center;
            padding: 24px 12px;
            font-size: 0.75rem;
            color: var(--text-sub);
            border-top: 1px solid var(--border-color);
            margin-top: 12px;
        }

        /* ----- 通用模态框样式 ----- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: var(--modal-overlay);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px 28px;
            max-width: 560px;
            width: 100%;
            border: 1px solid var(--border-color);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .modal-box .modal-title {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .modal-box .modal-sub {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 16px;
            word-break: break-all;
        }

        .modal-box .modal-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            margin-bottom: 18px;
            box-sizing: border-box;
        }

        .modal-box .modal-input:focus {
            border-color: var(--primary-color);
        }

        .modal-box .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-box .modal-actions button {
            padding: 8px 22px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--btn-sec-bg);
            color: var(--btn-sec-text);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .modal-box .modal-actions button:hover {
            background: var(--border-color);
        }

        .modal-box .modal-actions .btn-confirm {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
        }

        .modal-box .modal-actions .btn-confirm:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .modal-format-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .modal-format-label {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .format-option {
            padding: 5px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--btn-sec-bg);
            color: var(--btn-sec-text);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s;
            min-width: 68px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .format-option:hover:not(.active) {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .format-option.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
        }

        .owner-tag {
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-sub);
            background: var(--badge-bg);
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid var(--badge-border);
            margin-left: -4px;
            white-space: nowrap;
            opacity: 0.8;
        }

        /* ----- 选择列表模态框（纯文字，无图标） ----- */
        .select-list {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        .select-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            border-bottom: 1px solid var(--border-color);
            gap: 8px;
            flex-wrap: wrap;
        }
        .select-item:last-child {
            border-bottom: none;
        }
        .select-item .item-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 120px;
        }
        .select-item .item-name {
            font-weight: 500;
            color: var(--text-main);
        }
        .select-item .item-id {
            font-family: monospace;
            color: var(--text-sub);
            font-size: 0.8rem;
            background: var(--id-badge-bg);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .select-item .item-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .select-item .btn-sm {
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--btn-sm-bg);
            color: var(--btn-sm-text);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.15s;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .select-item .btn-sm:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
        }

        .winui-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-main);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            z-index: 3000;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.3s ease;
            pointer-events: none;
        }

        .winui-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .modal-box { padding: 20px 18px; max-width: 100%; }
            .modal-box .modal-actions button { padding: 8px 16px; font-size: 0.85rem; }
            .copy-btn { height: 28px; min-height: 28px; max-height: 28px; font-size: 0.7rem; padding: 0 8px; }
            .copy-btn.cmd-btn { margin-left: 2px; }
            .version-btn { padding: 4px 10px; font-size: 0.7rem; }
            .format-option { padding: 4px 12px; font-size: 0.75rem; min-width: 60px; height: 28px; }
            .modal-format-row { gap: 6px; }
            .owner-tag { font-size: 0.5rem; padding: 1px 6px; }
            .recipe-tag { font-size: 0.65rem; padding: 1px 6px; }
            .select-item { padding: 6px 10px; flex-direction: column; align-items: stretch; }
            .select-item .item-info { flex-wrap: wrap; }
            .select-item .item-actions { justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <div class="container animate-in">
        <div class="app-titlebar">
            <div class="title-area">
                <h1>迷你物品ID查询</h1>
                <span class="version-badge">实时同步</span>
                <div class="version-group" id="versionGroup">
                    <!-- 顺序：1.58 → 1.56 → 1.2.5 → 0.52 → 0.44 → 0.10.8 -->
                    <button class="version-btn active" data-version="v158">1.58</button>
                    <button class="version-btn" data-version="latest">1.56</button>
                    <button class="version-btn" data-version="v125">1.2.5</button>
                    <button class="version-btn" data-version="v052">0.52</button>
                    <button class="version-btn" data-version="old">0.44</button>
                    <button class="version-btn" data-version="v0108">0.10.8</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="search-wrapper">
                <div class="search-box-wrapper" id="searchWrapper">
                    <input type="text" id="searchInput" class="winui-input" placeholder="输入物品名或ID" autocomplete="off">
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="searchBtn">查询</button>
                    <button class="btn btn-secondary" id="resetBtn">重置</button>
                </div>
            </div>
        </div>

        <div class="datagrid-container" id="tableWrapper">
            <table class="item-table">
                <thead>
                    <tr>
                        <th style="width:50px">图标</th>
                        <th>物品名称</th>
                        <th>物品ID</th>
                        <th>类别</th>
                        <th>合成配方 / 描述</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="6" style="text-align:center; padding:40px;">数据同步中...</td></tr>
                </tbody>
            </table>
        </div>

        <div id="pagination" class="pagination-modern"></div>

        <footer class="footer-copyright">
            <div style="opacity: 0.7;">
                <span>服务驱动：星辉阁</span>
                <span style="margin: 0 8px; opacity: 0.5;">|</span>
                <span>UI开发：迷月月</span>
            </div>
        </footer>
    </div>

    <!-- ===== 指令模态框 ===== -->
    <div class="modal-overlay" id="commandModal">
        <div class="modal-box">
            <div class="modal-title">输入数量</div>
            <div class="modal-sub">
                物品：<strong id="modalItemName"></strong> &nbsp;（ID：<span id="modalItemId"></span>）
            </div>
            <div class="modal-format-row">
                <span class="modal-format-label">指令格式：</span>
                <button class="format-option active" data-format="take">/取物</button>
                <span class="owner-tag">自用</span>
                <button class="format-option" data-format="give">/give</button>
            </div>
            <input type="number" class="modal-input" id="modalQuantity" value="1" min="1" step="1" autofocus>
            <div class="modal-actions">
                <button id="modalCancelBtn">取消</button>
                <button class="btn-confirm" id="modalConfirmBtn">复制指令</button>
            </div>
        </div>
    </div>

    <!-- ===== 选择物品模态框（纯文字，无图标） ===== -->
    <div class="modal-overlay" id="selectModal">
        <div class="modal-box">
            <div class="modal-title">选择物品</div>
            <div class="modal-sub" id="selectModalSub">匹配到多个物品，请点击对应按钮复制：</div>
            <div class="select-list" id="selectListContainer"></div>
            <div class="modal-actions">
                <button id="selectModalCancelBtn">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // =====================  API 配置（按顺序排列） =====================
        const API_CONFIG = {
            v158: {
                label: '1.58',
                data: 'https://api.yuanxin520.top/api/1.58id.txt',
                type: 'desc'
            },
            latest: {
                label: '1.56',
                data: 'https://api.yuanxin520.top/api/1.56id.txt',
                type: 'desc'
            },
            v125: {
                label: '1.2.5',
                data: 'https://api.yuanxin520.top/api/1.2.5id.txt',
                type: 'recipe'
            },
            v052: {
                label: '0.52',
                data: 'https://api.yuanxin520.top/api/0.52id.txt',
                type: 'recipe'
            },
            old: {
                label: '0.44',
                data: 'https://api.yuanxin520.top/api/0.44id.txt',
                type: 'recipe'
            },
            v0108: {
                label: '0.10.8',
                data: 'https://api.yuanxin520.top/api/0.10.8id.txt',
                type: 'recipe'
            }
        };
        // ================================================================

        let currentVersion = 'v158';
        let fullItems = [];
        let currentItems = [];
        let currentPage = 1;
        const pageSize = 20;

        // ---- DOM 引用 ----
        const tableBody = document.getElementById("tableBody");
        const paginationDiv = document.getElementById("pagination");
        const searchInput = document.getElementById("searchInput");
        const versionGroup = document.getElementById("versionGroup");
        const modalOverlay = document.getElementById("commandModal");
        const modalItemName = document.getElementById("modalItemName");
        const modalItemId = document.getElementById("modalItemId");
        const modalQuantity = document.getElementById("modalQuantity");
        const modalConfirmBtn = document.getElementById("modalConfirmBtn");
        const modalCancelBtn = document.getElementById("modalCancelBtn");

        // 选择模态框
        const selectModal = document.getElementById("selectModal");
        const selectListContainer = document.getElementById("selectListContainer");
        const selectModalSub = document.getElementById("selectModalSub");
        const selectCancelBtn = document.getElementById("selectModalCancelBtn");

        let commandFormat = 'take';

        // ---- SVG（仅保留必要界面图标） ----
        const SVGS = {
            search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
            copy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
            left: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>`,
            right: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`,
            box: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>`
        };

        // 搜索图标
        const sWrapper = document.getElementById('searchWrapper');
        const sIcon = document.createElement('div');
        sIcon.className = 'icon-box';
        sIcon.innerHTML = SVGS.search;
        sWrapper.insertBefore(sIcon, sWrapper.firstChild);

        // ---- 版本切换 ----
        function switchVersion(version) {
            if (!API_CONFIG[version]) return;
            currentVersion = version;
            document.querySelectorAll('.version-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.version === version);
            });
            loadData();
        }

        versionGroup.addEventListener('click', (e) => {
            const btn = e.target.closest('.version-btn');
            if (btn && btn.dataset.version !== currentVersion) {
                switchVersion(btn.dataset.version);
            }
        });

        // ---- 数据解析 ----
        function parseData(raw) {
            const items = [];
            const regex = /\{([^}]+)\}/g;
            let m;
            while ((m = regex.exec(raw)) !== null) {
                const parts = m[1].split(",").map(s => s.trim());
                if (parts.length >= 3) {
                    items.push({
                        id: parts[0],
                        name: parts[1],
                        type: parts[2],
                        extra: parts.slice(3).join(",").replace(/^"|"$/g, "").trim()
                    });
                }
            }
            return items;
        }

        // ---- 模糊查找（忽略大小写、空格） ----
        function findItemsByNameFuzzy(name) {
            const normalized = name.trim().toLowerCase().replace(/\s+/g, '');
            if (!normalized) return [];
            return fullItems.filter(item => {
                const itemName = item.name.toLowerCase().replace(/\s+/g, '');
                return itemName.includes(normalized) || normalized.includes(itemName);
            });
        }

        // ---- 复制文本通用函数 ----
        async function copyTextToClipboard(text, successMsg) {
            try {
                await navigator.clipboard.writeText(text);
                showToast(successMsg || '已复制');
            } catch (_) {
                const ta = document.createElement("textarea");
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand("copy");
                document.body.removeChild(ta);
                if (ok) showToast(successMsg || '已复制');
                else showToast('复制失败，请手动复制');
            }
        }

        // ---- 处理点击配方材料：弹出选择弹窗 ----
        window.handleRecipeClick = function(name) {
            const matches = findItemsByNameFuzzy(name);
            if (matches.length === 0) {
                showToast(`未找到与「${name}」匹配的物品`);
                return;
            }
            if (matches.length === 1) {
                // 直接弹出该物品的选择（仍显示弹窗，让用户选择复制ID还是指令）
                showSelectModal(matches, name);
            } else {
                showSelectModal(matches, name);
            }
        };

        // ---- 显示选择弹窗 ----
        function showSelectModal(items, searchName) {
            selectModalSub.textContent = `匹配到 ${items.length} 个物品（搜索：${searchName}），请选择操作：`;
            selectListContainer.innerHTML = items.map(item => `
                <div class="select-item">
                    <div class="item-info">
                        <span class="item-name">${item.name}</span>
                        <span class="item-id">${item.id}</span>
                    </div>
                    <div class="item-actions">
                        <button class="btn-sm" onclick="copyIdDirect('${item.id}', '${item.name}')">复制ID</button>
                        <button class="btn-sm" onclick="copyCommandDirect('${item.id}', '${item.name}')">复制指令 /取物 1</button>
                    </div>
                </div>
            `).join('');
            selectModal.classList.add('active');
        }

        // ---- 直接复制ID（供选择弹窗使用） ----
        window.copyIdDirect = function(id, name) {
            copyTextToClipboard(id, `已复制 ${name} 的 ID`);
            // 不关闭弹窗，方便继续操作
        };

        // ---- 直接复制指令（固定数量1） ----
        window.copyCommandDirect = function(id, name) {
            const cmd = `/取物 ${id} 1`;
            copyTextToClipboard(cmd, `已复制指令：${cmd}`);
        };

        // ---- 关闭选择弹窗 ----
        selectCancelBtn.addEventListener('click', () => {
            selectModal.classList.remove('active');
        });
        selectModal.addEventListener('click', (e) => {
            if (e.target === selectModal) selectModal.classList.remove('active');
        });

        // ---- 解析配方文本，生成可点击标签 ----
        function renderRecipeHtml(rawExtra) {
            if (!rawExtra) return '<span style="color:var(--text-sub);font-style:italic;">无</span>';
            const parts = rawExtra.split(/[,，]/).map(s => s.trim()).filter(Boolean);
            if (parts.length === 0) return rawExtra;

            const itemRegex = /^(.+?)\s*[x×]\s*(\d+)$/i;
            let html = '';
            parts.forEach((part, idx) => {
                const match = part.match(itemRegex);
                if (match) {
                    const name = match[1].trim();
                    const qty = match[2];
                    // 生成可点击标签（调用 handleRecipeClick）
                    const escapedName = name.replace(/'/g, "\\'");
                    html += `<span class="recipe-tag" onclick="handleRecipeClick('${escapedName}')" title="点击选择物品">
                                ${name}<span class="qty">×${qty}</span>
                             </span>`;
                } else {
                    html += `<span style="color:var(--text-sub);">${part}</span>`;
                }
                if (idx < parts.length - 1) html += ' ';
            });
            return html;
        }

        // ---- 加载数据 ----
        async function loadData() {
            try {
                const apiUrl = API_CONFIG[currentVersion].data;
                console.log(`加载数据 (${API_CONFIG[currentVersion].label}):`, apiUrl);
                if (!apiUrl) {
                    tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;">未配置API地址</td></tr>`;
                    return;
                }
                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const text = await res.text();
                fullItems = parseData(text);
                console.log(`物品数量 (${API_CONFIG[currentVersion].label}):`, fullItems.length);
                if (fullItems.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;">暂无数据</td></tr>`;
                    return;
                }
                currentItems = [...fullItems];
                currentPage = 1;
                render();
            } catch (e) {
                console.error('加载失败:', e);
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;">加载失败: ${e.message}</td></tr>`;
            }
        }

        // ---- 渲染表格 ----
        function render() {
            const start = (currentPage - 1) * pageSize;
            const pageItems = currentItems.slice(start, start + pageSize);

            if (pageItems.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;">没有匹配的物品</td></tr>`;
                renderPagination();
                return;
            }

            const versionType = API_CONFIG[currentVersion].type || 'desc';

            tableBody.innerHTML = pageItems.map(item => {
                let extraHtml = '';
                if (versionType === 'recipe') {
                    extraHtml = renderRecipeHtml(item.extra);
                } else {
                    extraHtml = `<span style="color:var(--text-sub);">${item.extra || '--'}</span>`;
                }

                return `
                    <tr class="animate-in">
                        <td><div class="icon-container">${createIconHtml(item.id)}</div></td>
                        <td class="name-cell">${item.name}</td>
                        <td><span class="id-badge">${item.id}</span></td>
                        <td><span>${item.type}</span></td>
                        <td class="desc-cell">${extraHtml}</td>
                        <td>
                            <button class="copy-btn" onclick="copyIdDirect('${item.id}', '${item.name}')">
                                <span style="width:14px;height:14px;display:inline-block">${SVGS.copy}</span>
                                <span>复制ID</span>
                            </button>
                            <button class="copy-btn cmd-btn" onclick="openCommandModal('${item.id}', '${item.name}')">
                                <span>复制指令</span>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            renderPagination();
        }

        // ---- 图标加载（使用指定图标源） ----
        function createIconHtml(id) {
            return `
                <div class="icon-placeholder" id="p-${id}">${SVGS.box}</div>
                <img class="item-icon" src="https://qiugf.cn/kfz/cxid/ico/${id}.png" 
                     onload="this.style.display='block';document.getElementById('p-${id}').style.display='none'" 
                     onerror="this.style.display='none';document.getElementById('p-${id}').style.display='block'">
            `;
        }

        // ---- 分页 ----
        function renderPagination() {
            const totalPages = Math.ceil(currentItems.length / pageSize) || 1;
            paginationDiv.innerHTML = `
                <button onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>${SVGS.left} 上一页</button>
                <span style="font-size:0.8rem;font-weight:600">页码 ${currentPage} / ${totalPages}</span>
                <button onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}>下一页 ${SVGS.right}</button>
            `;
        }

        window.changePage = (dir) => {
            const totalPages = Math.ceil(currentItems.length / pageSize) || 1;
            const newPage = currentPage + dir;
            if (newPage < 1 || newPage > totalPages) return;
            currentPage = newPage;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // ---- 复制指令（模态框） ----
        let pendingItemId = '';
        let pendingItemName = '';

        window.openCommandModal = function(id, name) {
            pendingItemId = id;
            pendingItemName = name;
            modalItemName.textContent = name;
            modalItemId.textContent = id;
            modalQuantity.value = 1;
            commandFormat = 'take';
            document.querySelectorAll('.format-option').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.format === 'take');
            });
            modalOverlay.classList.add('active');
            setTimeout(() => modalQuantity.focus(), 100);
        };

        function closeCommandModal() {
            modalOverlay.classList.remove('active');
        }

        function confirmCommand() {
            const qty = parseInt(modalQuantity.value, 10) || 1;
            if (qty < 1) {
                showToast('数量不能小于1');
                return;
            }
            const prefix = commandFormat === 'take' ? '/取物' : '/give';
            const cmd = `${prefix} ${pendingItemId} ${qty}`;
            copyTextToClipboard(cmd, `已复制指令：${cmd}`);
            closeCommandModal();
        }

        modalConfirmBtn.addEventListener('click', confirmCommand);
        modalCancelBtn.addEventListener('click', closeCommandModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeCommandModal();
        });
        modalQuantity.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); confirmCommand(); }
            if (e.key === 'Escape') { closeCommandModal(); }
        });

        // ---- 格式切换 ----
        document.querySelectorAll('.format-option').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                document.querySelectorAll('.format-option').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                commandFormat = this.dataset.format;
            });
        });

        // ---- Toast ----
        function showToast(msg) {
            let t = document.querySelector('.winui-toast');
            if (!t) {
                t = document.createElement("div");
                t.className = "winui-toast";
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.classList.remove('show');
            void t.offsetWidth;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2200);
        }

        // ---- 搜索 / 重置 ----
        document.getElementById('searchBtn').addEventListener('click', () => {
            const kw = searchInput.value.trim().toLowerCase();
            if (!kw) {
                currentItems = [...fullItems];
            } else {
                currentItems = fullItems.filter(i =>
                    i.name.toLowerCase().includes(kw) || i.id.includes(kw)
                );
            }
            currentPage = 1;
            render();
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            searchInput.value = '';
            currentItems = [...fullItems];
            currentPage = 1;
            render();
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('searchBtn').click();
            }
        });

        // ---- 主题控制 ----
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        }

        Object.defineProperty(window, 'dark', {
            get: function() { applyTheme('dark'); return 'Dark theme activated.'; },
            configurable: true
        });
        Object.defineProperty(window, 'light', {
            get: function() { applyTheme('light'); return 'Light theme activated.'; },
            configurable: true
        });

        const initialTheme = localStorage.getItem('theme') || 'light';
        applyTheme(initialTheme);

        // ---- 启动 ----
        loadData();

        console.log('%c迷你物品ID查询器已启动（配方点击弹出选择，复制ID或指令）', 'color:#2563eb;font-weight:bold;');
        console.log('%c点击配方材料 → 选择物品 → 复制ID或/取物指令', 'color:#16a34a;font-weight:bold;');
        console.log('%c控制台输入 dark 或 light 切换主题', 'color:#64748b;');
    </script>
</body>
</html>
